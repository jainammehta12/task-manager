<!DOCTYPE html>
<html>
<head>
    <title>Smart Task Manager</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
        }
        .container {
            margin-top: 50px;
        }
        input {
            padding: 10px;
            width: 250px;
        }
        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        .add { background: #22c55e; }
        .process { background: #3b82f6; }
        .undo { background: #f59e0b; }
        .box {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid white;
            width: 300px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📋 Smart Task Manager</h1>

    <input type="text" id="taskInput" placeholder="Enter task">

    <br><br>

    <button class="add" onclick="addTask()">Add Task</button>
    <button class="process" onclick="processTask()">Process Task</button>
    <button class="undo" onclick="undoTask()">Undo</button>

    <div class="box">
        <h3>Pending Tasks (Queue)</h3>
        <ul id="pending"></ul>
    </div>

    <div class="box">
        <h3>Completed Tasks (Stack)</h3>
        <ul id="completed"></ul>
    </div>
</div>

<script>
    let queue = [];
    let stack = [];

    function addTask() {
        let task = document.getElementById("taskInput").value;
        if (task === "") return alert("Enter task!");

        queue.push(task);
        document.getElementById("taskInput").value = "";
        display();
    }

    function processTask() {
        if (queue.length === 0) return alert("No tasks!");

        let task = queue.shift();
        stack.push(task);
        display();
    }

    function undoTask() {
        if (stack.length === 0) return alert("Nothing to undo!");

        let task = stack.pop();
        queue.push(task);
        display();
    }

    function display() {
        let p = document.getElementById("pending");
        let c = document.getElementById("completed");

        p.innerHTML = "";
        c.innerHTML = "";

        queue.forEach(t => {
            let li = document.createElement("li");
            li.textContent = t;
            p.appendChild(li);
        });

        [...stack].reverse().forEach(t => {
            let li = document.createElement("li");
            li.textContent = t;
            c.appendChild(li);
        });
    }
</script>

</body>
</html>
